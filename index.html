<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizzeria bella Napoli</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; padding: 20px; }
    h1 { color: #00b4d8; }
    .tm-tab-content { margin-bottom: 30px; padding: 15px; background: #262626; border-radius: 8px; }
    .tm-list-item { display: flex; align-items: center; gap: 15px; margin: 15px 0; padding: 10px; background: #333; border-radius: 6px; }
    .tm-list-item-img { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; }
    .tm-list-item-price { color: #00b4d8; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>Pizzeria bella Napoli</h1>

  <!-- elenco pizze -->
  <div id="Pizze" class="tm-tab-content">
    <h2>Pizze</h2>
    <div class="tm-list">

    </div>
  </div>

  <!-- elenco dolci -->
  <div id="Dolci" class="tm-tab-content">
    <h2>Dolci</h2>
    <div class="tm-list">

    </div>
  </div>

  <!-- elenco bevande -->
  <div id="Bevande" class="tm-tab-content">
    <h2>Bevande</h2>
    <div class="tm-list">
      <div class="tm-list-item">
        <img src="img/espresso.png" alt="Image" class="tm-list-item-img">
        <div class="tm-black-bg tm-list-item-text">
          <h3 class="tm-list-item-name">Caff&egrave; Espresso <span class="tm-list-item-price">€2.50</span></h3>
          <p class="tm-list-item-description">Miscela arabica di qualit&agrave; superiore.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
